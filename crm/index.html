<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Учёт оплат</title>
<style>
:root {
  color-scheme: light;
  --bg: #f6f6f4; --surface: #fcfcfb; --surface-2: #f0efec; --border: #e2e1dc;
  --text: #0b0b0b; --text-2: #52514e; --muted: #7a7974;
  --accent: #2a78d6; --accent-ink: #fff;
  --series-1: #2a78d6; --series-2: #eb6834;
  --ok: #0f7b3e; --ok-bg: #e3f4ea; --warn: #8a5a00; --warn-bg: #fdf1d6; --bad: #b42318; --bad-bg: #fde8e6;
  --grid: #e9e8e4;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #121211; --surface: #1a1a19; --surface-2: #232321; --border: #33332f;
    --text: #f0efec; --text-2: #c3c2b7; --muted: #8e8d86;
    --accent: #3987e5; --series-1: #3987e5; --series-2: #d95926;
    --ok: #5cc98a; --ok-bg: #173323; --warn: #e5b450; --warn-bg: #3a2d10; --bad: #f08a80; --bad-bg: #3d1a17;
    --grid: #2a2a27;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
header { display: flex; align-items: center; gap: 16px; padding: 12px 20px; background: var(--surface); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 5; flex-wrap: wrap; }
header h1 { font-size: 16px; margin: 0; font-weight: 650; }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; }
.tabs button { border: 0; background: none; padding: 7px 12px; border-radius: 8px; color: var(--text-2); font: inherit; cursor: pointer; }
.tabs button:hover { background: var(--surface-2); }
.tabs button.active { background: var(--accent); color: var(--accent-ink); }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); color: var(--text-2); padding: 6px 12px; font: inherit; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--border); }
.seg button.active { background: var(--surface-2); color: var(--text); font-weight: 600; }
.chip:not(.ok):not(.warn):not(.bad) { background: var(--surface-2); color: var(--text-2); }
.badge:empty { display: none; }
.badge { background: var(--bad); color: #fff; border-radius: 10px; padding: 0 6px; font-size: 11px; margin-left: 4px; }
main { padding: 16px 20px 60px; max-width: 1400px; margin: 0 auto; }
.toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
.spacer { flex: 1; }
.row { display: flex; align-items: center; } .gap { gap: 10px; } .wrap { flex-wrap: wrap; } .grow { flex: 1; min-width: 200px; }
select, input[type=search], input[type=number], input:not([type]), textarea { font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 6px 8px; max-width: 100%; }
input[type=search] { min-width: 220px; }
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border); background: var(--surface); color: var(--text); padding: 7px 12px; border-radius: 8px; cursor: pointer; font: inherit; white-space: nowrap; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.danger { color: var(--bad); }
.icon { border: 0; background: none; font-size: 20px; line-height: 1; cursor: pointer; color: var(--muted); padding: 2px 8px; border-radius: 6px; }
.icon:hover { background: var(--surface-2); color: var(--text); }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; margin-bottom: 14px; }
.card h3 { margin: 0 0 10px; font-size: 15px; font-weight: 620; }
.grid2 { display: grid; grid-template-columns: 1.3fr 1fr; gap: 14px; align-items: start; }
@media (max-width: 960px) { .grid2 { grid-template-columns: 1fr; } }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin-bottom: 14px; }
.kpi { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; }
.kpi.alert { border-color: var(--bad); }
.k-label { color: var(--text-2); font-size: 12.5px; }
.k-val { font-size: 22px; font-weight: 650; font-variant-numeric: tabular-nums; margin-top: 2px; }
.small-kpis .k-val { font-size: 17px; }
.k-sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
.tbl-wrap { overflow-x: auto; }
.tbl-wrap.tall { max-height: 55vh; overflow-y: auto; }
.tbl { width: 100%; border-collapse: collapse; background: var(--surface); }
.tbl th, .tbl td { padding: 8px 10px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: top; }
.tbl.compact th, .tbl.compact td { padding: 5px 8px; }
.tbl th { font-weight: 600; color: var(--text-2); font-size: 12.5px; background: var(--surface); position: sticky; top: 0; }
.tbl tfoot td { font-weight: 650; border-top: 2px solid var(--border); }
.tbl .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tbl tr.click { cursor: pointer; } .tbl tr.click:hover td { background: var(--surface-2); }
.tbl tr.warnrow td { background: var(--warn-bg); }
.tbl tr.payrow td { color: var(--text-2); }
th.sortable { cursor: pointer; user-select: none; } th.sortable:hover { color: var(--text); }
.amt { width: 120px; text-align: right; }
.desc { max-width: 420px; }
.muted { color: var(--muted); } .small { font-size: 12.5px; } .nowrap { white-space: nowrap; }
.bad-t { color: var(--bad); font-weight: 600; } .ok-t { color: var(--ok); }
.chip { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 12px; white-space: nowrap; }
.chip.ok { background: var(--ok-bg); color: var(--ok); } .chip.warn { background: var(--warn-bg); color: var(--warn); } .chip.bad { background: var(--bad-bg); color: var(--bad); }
.tag { display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 6px; background: var(--surface-2); color: var(--text-2); border: 1px solid var(--border); }
.hint { color: var(--text-2); font-size: 13px; margin: 0 0 12px; }
.notice { background: var(--warn-bg); color: var(--warn); border-radius: 10px; padding: 10px 14px; margin-bottom: 14px; }
.notice a { color: inherit; font-weight: 600; }
a { color: var(--accent); text-decoration: none; } a:hover { text-decoration: underline; }
.empty { background: var(--surface); border: 1px dashed var(--border); border-radius: 12px; padding: 28px; text-align: left; }
.empty h2 { margin-top: 0; }
.payer-group select { min-width: 280px; }
.bar { height: 4px; background: var(--surface-2); border-radius: 2px; margin-top: 4px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--series-1); border-radius: 2px; }
.hbar { display: grid; grid-template-columns: 110px 1fr 150px; gap: 10px; align-items: center; margin-bottom: 8px; }
.hbar .bar { height: 10px; margin: 0; } .hbar .num { text-align: right; font-variant-numeric: tabular-nums; }
.legend { display: flex; gap: 16px; font-size: 12.5px; color: var(--text-2); margin-bottom: 6px; }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
.sw.s1, .chart .s1 { background: var(--series-1); fill: var(--series-1); }
.sw.s2, .chart .s2 { background: var(--series-2); fill: var(--series-2); }
.chart { width: 100%; height: auto; display: block; }
.chart .gridline { stroke: var(--grid); stroke-width: 1; } .chart .baseline { stroke: var(--border); stroke-width: 1; }
.chart .axis { fill: var(--muted); font-size: 11px; }
.chart .hit { fill: transparent; cursor: default; }
.tableview summary { cursor: pointer; color: var(--text-2); font-size: 12.5px; margin-top: 8px; }
#tip { position: fixed; z-index: 50; background: var(--text); color: var(--surface); padding: 5px 9px; border-radius: 6px; font-size: 12.5px; pointer-events: none; }
dialog { border: 1px solid var(--border); border-radius: 14px; background: var(--bg); color: var(--text); width: min(1000px, 94vw); max-height: 90vh; padding: 18px 20px; }
dialog::backdrop { background: rgba(0,0,0,.35); }
dialog h2 { margin: 0; font-size: 18px; }
.client-form { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 16px; margin: 14px 0; }
.client-form label { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; color: var(--text-2); }
.client-form .wide { grid-column: 1 / -1; }
label.check { flex-direction: row !important; align-items: center; gap: 8px; color: var(--text); font-size: 14px; }
.months-pick { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 4px 12px; max-height: 40vh; overflow-y: auto; margin: 10px 0 14px; padding: 10px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; }
#toasts { position: fixed; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 8px; z-index: 100; max-width: 420px; }
.toast { background: var(--text); color: var(--surface); padding: 10px 14px; border-radius: 10px; box-shadow: 0 4px 14px rgba(0,0,0,.2); }
.toast.ok { background: var(--ok); color: #fff; } .toast.bad { background: var(--bad); color: #fff; }
@media (max-width: 640px) {
  header, main { padding-left: 16px; padding-right: 16px; }
  .client-form { grid-template-columns: 1fr; }
  input[type=search] { min-width: 0; width: 100%; }
  .hbar { grid-template-columns: 80px 1fr 110px; }
}
</style>
</head>
<body>
<header>
  <h1>Учёт оплат</h1>
  <nav class="tabs">
    <button data-tab="summary">Сводка</button>
    <button data-tab="clients">Клиенты и долги</button>
    <button data-tab="month">Месяц</button>
    <button data-tab="payments">Поступления<span class="badge" id="badge-unmatched"></span></button>
    <button data-tab="analytics">Аналитика</button>
    <button data-tab="data">Данные</button>
  </nav>
</header>
<main id="view"></main>
<dialog id="modal"><div id="modal-body"></div></dialog>
<div id="tip" hidden></div>
<div id="toasts"></div>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="seed.js"></script>
<script src="seed.private.js"></script>

<script src="app.js"></script>
</body>
</html>
